# Local stand-ins for v4's GCP services. Start with: docker compose up -d
# Ports bind to 127.0.0.1 only — not reachable from other machines.
services:
  db:                       # Cloud SQL Postgres 16 + pgvector
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: easychat
      POSTGRES_PASSWORD: easychat   # local dev only
      POSTGRES_DB: easychat
    ports: ["127.0.0.1:5432:5432"]
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U easychat -d easychat"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:                    # Memorystore (rate limits, budget, queue)
    image: redis:7
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:                  # SendGrid stand-in; inbox UI at http://localhost:8025
    image: axllent/mailpit:v1.21
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]

  # The API in its production image, against the services above (no local Python needed):
  #   docker compose --profile api up --build api
  # Reads api/.env, but points at the compose hosts. Run migrations + seed first (README).
  api:
    profiles: ["api"]
    build: { context: ./api, target: runtime }
    env_file: api/.env
    environment:
      DATABASE_URL: postgresql://easychat_api:local-api-password@db:5432/easychat
      MIGRATION_DATABASE_URL: postgresql://easychat:easychat@db:5432/easychat
      REDIS_URL: redis://redis:6379/0
    ports: ["127.0.0.1:8000:8080"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  # Test suite in a throwaway database (easychat_test) and Redis db 15:
  #   docker compose run --rm --build api-test
  api-test:
    profiles: ["test"]
    build: { context: ./api, target: test }
    volumes: ["./api:/app"]        # run the current source without rebuilding
    environment:
      APP_ENV: test
      DATABASE_URL: postgresql://easychat_api_test:test-api-password@db:5432/easychat_test
      MIGRATION_DATABASE_URL: postgresql://easychat:easychat@db:5432/easychat_test
      REDIS_URL: redis://redis:6379/15
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

volumes:
  dbdata:
