name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: API tests (Postgres + Redis)
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: easychat
          POSTGRES_PASSWORD: easychat   # throwaway CI database
          POSTGRES_DB: easychat
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U easychat -d easychat"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://easychat_api_test:test-api-password@localhost:5432/easychat_test
      MIGRATION_DATABASE_URL: postgresql://easychat:easychat@localhost:5432/easychat_test
      REDIS_URL: redis://localhost:6379/15
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  api-image:
    name: API image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target runtime -t easychat-api:ci api/

  widget:
    name: Widget typecheck, build, size budget
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: widget
    env:
      VITE_API_BASE: https://api.example.invalid   # build-time placeholder; real value set per deploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: widget/package-lock.json
      - run: npm ci
      - run: npm run build   # tsc --noEmit + vite build + gzip budget check
